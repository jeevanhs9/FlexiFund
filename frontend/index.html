<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7f4" />
    <meta
      name="description"
      content="FlexiFund helps irregular-income workers understand their weekly finances."
    />
    <title>FlexiFund · Financial overview</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("flexifund-theme") || "system";
          const useDark = saved === "dark" || (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = useDark ? "dark" : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
