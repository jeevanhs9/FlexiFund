<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1628" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f8fc" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlexiFund" />
    <meta
      name="description"
      content="FlexiFund helps irregular-income workers understand their weekly finances."
    />
    <title>FlexiFund · Financial overview</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("flexifund-theme") || "system";
          const useDark = saved === "dark" || (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = useDark ? "dark" : "light";
          // Set theme color for mobile browsers
          const themeColor = useDark ? "#0a1628" : "#f5f8fc";
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColor);
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <!-- Scroll Progress Bar -->
    <div class="scroll-progress-bar"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
